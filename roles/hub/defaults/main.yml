---
# defaults file for hub
# Allowed hub_states values
_hub_states:
  - present
  - absent
# State of the Beszel hub installation
hub_state: present
# Version of the Beszel hub to install
# Can be a specific version from GitHub (e.g., v0.9.1)
hub_version: latest
# Bind address for the Beszel hub to listen on
hub_bind_address: 0.0.0.0
# Port for the Beszel hub to listen on
hub_port: 8090
# Directory to install the Beszel hub into
hub_install_dir: /usr/local/bin
# Directory to create and place the Beszel hub data into
hub_data_dir: /var/lib/beszel
# Name of the user to create and run the Beszel hub as
hub_user: beszel
# UID for the hub user used to run the Beszel hub (chosen automatically by the OS if not specified).
# hub_uid: 1001
# Groups to add the Beszel hub user to
hub_user_groups: []
# Custom arguments for the Beszel hub
hub_args: ""
# Enable the "update available" notification in the Beszel hub web UI (v0.18.5+)
hub_check_updates: false
# Share all systems with all users of the Beszel hub
hub_share_all_systems: false
# Disable the SSH fallback of the Beszel hub so it only uses WebSocket connections to agents (v0.21.0+)
hub_disable_ssh: false
# Public URL of the Beszel hub, used for links in notifications (e.g., https://beszel.example.tld)
hub_app_url: ""
# Sync system names with the hostnames reported by agents (v0.21.0+)
hub_sync_system_names: false
# Enable the Beszel hub systemd service on boot
hub_service_enabled: true
# State of the Beszel hub systemd service
hub_service_state: started
