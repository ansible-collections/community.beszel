---
# absent tasks file for agent
- name: agent_absent | Stop Beszel binary agent systemd service
  ansible.builtin.service:
    name: beszel-agent
    state: stopped

- name: agent_absent | Remove Beszel binary agent systemd service
  ansible.builtin.file:
    path: /etc/systemd/system/beszel-agent.service
    state: absent

- name: agent_absent | Remove user for the Beszel binary agent
  ansible.builtin.user:
    name: "{{ agent_user }}"
    shell: /sbin/nologin
    state: absent

- name: agent_absent | Remove Beszel binary agent
  ansible.builtin.file:
    path: "{{ agent_install_dir }}/beszel-agent"
    state: absent

- name: agent_absent | Remove udev rule for S.M.A.R.T disks
  notify:
    - Reload udev rules
    - Trigger udev rules for S.M.A.R.T disks
  ansible.builtin.file:
    path: /etc/udev/rules.d/99-smartctl-disk-group.rules
    state: absent
