[project]
name = "community-beszel"
version = "2.1.0"
description = "Ansible community collection for Beszel."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "pocketbase",
]

[dependency-groups]
dev = [
    "antsibull-changelog>=0.35.1",
    "codespell>=2.4.1",
    "prek>=0.2.20",
    {include-group = "test"},
]
test = [
    "ruff>=0.15.10",
    "ansible-lint>=26.6.0",
    "tox-uv-bare>=1.35.1",
    "tox-ansible>=26.7.1",
]

[tool.tox-ansible]
coverage = true
skip = [
    "2.16",
    "2.17",
    "2.18"
]
