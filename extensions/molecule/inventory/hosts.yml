all:
  vars:
    image: docker.io/geerlingguy/docker-debian11-ansible:latest
    command: /sbin/init
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
  children:
    molecule:
      hosts:
        instance:
          ansible_connection: community.docker.docker
          expose:
            - 45876
          networks:
            - name: molecule_beszel
    molecule_hub:
      hosts:
        hub-instance:
          ansible_connection: community.docker.docker
