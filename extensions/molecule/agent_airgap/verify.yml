---
- name: Verify
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Verify | Get Beszel binary agent file properties
      ansible.builtin.stat:
        path: /usr/local/bin/beszel-agent
      register: agent_binary

    - name: Verify | Assert the Beszel binary agent is owned by the agent user
      ansible.builtin.assert:
        that:
          - agent_binary.stat.pw_name == 'beszel'
          - agent_binary.stat.gr_name == 'beszel'
        fail_msg: >-
          /usr/local/bin/beszel-agent is owned by {{ agent_binary.stat.pw_name }}:{{ agent_binary.stat.gr_name }},
          expected beszel:beszel.
