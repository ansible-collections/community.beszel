---
- name: Verify
  hosts: molecule_hub
  tasks:
    - name: Verify | Check Beszel hub is healthy
      ansible.builtin.uri:
        url: http://localhost:8090/api/health
        method: GET
        status_code: 200
      register: beszel_hub_health
      changed_when: false

    - name: Verify | Read Beszel hub systemd unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/beszel-hub.service
      register: hub_unit_file

    - name: Verify | Assert DISABLE_SSH is set in the systemd unit file
      ansible.builtin.assert:
        that: "'Environment=\"DISABLE_SSH=true\"' in (hub_unit_file.content | b64decode)"
        fail_msg: DISABLE_SSH=true was not found in the Beszel hub systemd unit file.

    - name: Verify | Read Beszel hub systemd service status
      ansible.builtin.systemd_service:
        name: beszel-hub
      register: hub_service

    - name: Verify | Read Beszel hub process environment
      ansible.builtin.slurp:
        src: /proc/{{ hub_service.status.MainPID }}/environ
      register: hub_process_environ

    - name: Verify | Assert the running Beszel hub has DISABLE_SSH set
      ansible.builtin.assert:
        that: "'DISABLE_SSH=true' in (hub_process_environ.content | b64decode)"
        fail_msg: The running Beszel hub was not restarted after its systemd unit file changed.
